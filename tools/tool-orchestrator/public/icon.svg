<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Framework Cockpit logo">
  <defs>
    <linearGradient id="accent" x1="20" y1="12" x2="78" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9cdcfe"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="76" height="76" rx="18" fill="#15161b" stroke="#353948" stroke-width="3" filter="url(#softShadow)"/>
  <rect x="10" y="10" width="76" height="76" rx="18" fill="url(#accent)" opacity=".14"/>

  <!-- cockpit window -->
  <path d="M24 58c2-17 11-29 24-29s22 12 24 29" fill="#1d1f27" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M29 57h38" stroke="#353948" stroke-width="4" stroke-linecap="round"/>

  <!-- tool constellation -->
  <circle cx="31" cy="63" r="6" fill="#15161b" stroke="#9cdcfe" stroke-width="4"/>
  <circle cx="48" cy="56" r="7" fill="#15161b" stroke="#f2cc60" stroke-width="4"/>
  <circle cx="65" cy="63" r="6" fill="#15161b" stroke="#7ee787" stroke-width="4"/>
  <path d="M37 61l5-3m12 0l5 3" stroke="#e6e6e8" stroke-width="3" stroke-linecap="round" opacity=".86"/>

  <!-- launch cue -->
  <path d="M48 23v15" stroke="#9cdcfe" stroke-width="5" stroke-linecap="round"/>
  <path d="M40 33l8-8 8 8" fill="none" stroke="#9cdcfe" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
