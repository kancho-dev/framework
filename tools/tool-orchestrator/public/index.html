<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cockpit</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/workspace-badge.css">
  <link rel="stylesheet" href="/shared/select.css">
  <link rel="stylesheet" href="/shared/daily-usage-heatmap.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/shared/cockpit-nav.css">
</head>
<body>
  <div id="cockpit-nav"></div>
  <main class="shell">
    <header class="topbar">
      <div class="brand-row">
        <img class="cockpit-logo" src="icon.svg" alt="" width="38" height="38">
        <h1>Framework Cockpit <span id="workspace" class="workspace-badge wide"></span></h1>
      </div>
      <div class="topbar-actions">
        <span id="refresh-notice" class="refresh-notice" hidden></span>
        <button id="edit-dashboard" class="customize-button" title="Customize dashboard">⚙ Customize</button>
        <button id="save-dashboard" class="button" hidden>Save layout</button>
        <button id="cancel-dashboard" class="ghost" hidden>Cancel</button>
      </div>
    </header>

    <section class="dashboard-section">
      <div class="section-title">
        <h2>Cockpit Widget Dashboard</h2>
        <p>Glanceable recovery widgets for the selected workspace.</p>
      </div>
      <div id="dashboard" class="dashboard-grid"></div>
    </section>
  </main>
  <script>
    const __cockpitParams = new URLSearchParams(location.search);
    const __cockpitWorkspace = __cockpitParams.get('workspace');
    const __cockpitWorkspaceQuery = __cockpitWorkspace ? `?workspace=${encodeURIComponent(__cockpitWorkspace)}` : '';
    window.__FRAMEWORK_COCKPIT__ = {
      enabled: true,
      home: `/${__cockpitWorkspaceQuery}`,
      icon: 'icon.svg',
      current: 'home',
      workspaceId: __cockpitWorkspace,
      tools: [
        { id: 'task-browser', title: 'Task Browser', shortTitle: 'Tasks', route: `/tools/tasks/${__cockpitWorkspaceQuery}`, icon: 'icons/task-browser.svg' },
        { id: 'session-browser', title: 'Session Browser', shortTitle: 'Sessions', route: `/tools/sessions/${__cockpitWorkspaceQuery}`, icon: 'icons/session-browser.svg' }
      ]
    };
  </script>
  <script src="/shared/cockpit-nav.js"></script>
  <script src="/shared/select.js"></script>
  <script src="/shared/workspace-badge.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
